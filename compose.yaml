services:
  test:
    build:
      context: .
    command: gradle --no-daemon verifyMilestone1
    volumes:
      - gradle-cache:/home/gradle/.gradle

  package:
    build:
      context: .
    command: gradle --no-daemon :fabric:packageMod
    volumes:
      - gradle-cache:/home/gradle/.gradle
      - ./dist:/workspace/dist

  inspect-packets:
    build:
      context: .
    command: sh -lc "gradle --no-daemon :fabric:compileClientJava >/dev/null && sh scripts/inspect-minecraft-packets.sh"
    volumes:
      - gradle-cache:/home/gradle/.gradle

volumes:
  gradle-cache:
