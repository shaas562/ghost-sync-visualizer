plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        ghostsync {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation project(':core')
    include project(':core')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// src/test contains a standalone headless smoke program rather than JUnit tests.
// Keep Gradle's normal build happy while the dedicated JavaExec task runs it.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

/**
 * Starts the real Sponge Mixin subsystem on Loom's Minecraft 26.2 test runtime,
 * parses the production mixin config, and resolves every critical target/mixin
 * class without starting Minecraft or creating a graphics context.
 */
tasks.register('headlessMixinBootstrap', JavaExec) {
    group = 'verification'
    description = 'Bootstraps Mixin and validates production client mixin/target class loading without launching Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.client.output
    mainClass = 'com.ghostsync.fabric.HeadlessMixinBootstrapProbe'
}

/** Copies the Minecraft 26.2 Fabric jar produced by Loom 1.17 into dist. */
tasks.register('packageMod', Copy) {
    dependsOn tasks.named('build')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(rootProject.layout.projectDirectory.dir('dist'))
}
