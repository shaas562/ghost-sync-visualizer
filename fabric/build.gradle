plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/'
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        ghostsync {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation project(':core')
    include project(':core')

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}

tasks.named('test') {
    useJUnitPlatform()
    classpath += sourceSets.client.output
}

// Fabric Loader's JUnit module owns Knot/Mixin bootstrap for this task. Keeping
// a dedicated task name makes the root verification pipeline explicit.
tasks.register('headlessMixinBootstrap') {
    group = 'verification'
    description = 'Runs the Fabric Loader JUnit headless Knot/Mixin integration probe.'
    dependsOn tasks.named('test')
}

/** Copies the Minecraft 26.2 Fabric jar produced by Loom 1.17 into dist. */
tasks.register('packageMod', Copy) {
    dependsOn tasks.named('build')
    from(tasks.named('jar').flatMap { it.archiveFile })
    into(rootProject.layout.projectDirectory.dir('dist'))
}
