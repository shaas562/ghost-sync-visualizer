name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and verify in Docker
        run: docker compose run --rm --build test

      - name: Inspect Minecraft 26.2 synchronization API
        run: docker compose run --rm inspect-packets
